# --- Application Configuration ---
spring.application.name=BulkProductsUpload
server.port=8080

# --- File Size Limits ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=500MB

# --- Logging ---
logging.level.root=INFO
logging.level.com.products=DEBUG

# --- AWS Configuration (Production) ---
# These values are used in production and are typically provided by environment variables.
# For local development against real AWS, you can set them in your ~/.aws/credentials file.
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:your-unique-bucket-name}

# --- LocalStack Reviewer's Guide ---
# To run this application against LocalStack for review, you do not need to modify this file.
# Simply create a new file named `application-local.properties` in this same directory (`src/main/resources`).
# The presence of that file will automatically activate the 'local' Spring profile,
# which is pre-configured to connect to a standard LocalStack instance (http://localhost:4566).
# See the `AwsLocalConfig.java` and `AwsProdConfig.java` classes for details.
